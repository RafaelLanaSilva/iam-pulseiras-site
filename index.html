    <!-- Consent Mode v2: negar armazenamento opcional antes de qualquer tag Google. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){window.dataLayer.push(arguments);};
      window.gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });

      // Este site usa Consent Mode básico: só carrega o GTM após aceite explícito.
      (function(){
        var containerId = 'GTM-5H39P76V';
        var loadGtm = function(){
          if (window.__iamGtmLoaded) return;
          window.__iamGtmLoaded = true;
          window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtm.js?id=' + containerId;
          document.head.appendChild(script);
        };
        var storedChoice = null;
        try { storedChoice = window.localStorage.getItem('iam-cookie-consent'); } catch (_) {}

        window.iamGoogleConsent = {
          hasAnalyticsConsent: function(){ return storedChoice === 'accepted'; },
          setChoice: function(choice){
            storedChoice = choice === 'accepted' ? 'accepted' : 'rejected';
            window.gtag('consent', 'update', {
              analytics_storage: storedChoice === 'accepted' ? 'granted' : 'denied',
              ad_storage: storedChoice === 'accepted' ? 'granted' : 'denied',
              ad_user_data: storedChoice === 'accepted' ? 'granted' : 'denied',
              ad_personalization: storedChoice === 'accepted' ? 'granted' : 'denied'
            });
            if (storedChoice === 'accepted') loadGtm();
          }
        };

        if (storedChoice === 'accepted') {
          window.iamGoogleConsent.setChoice('accepted');
        }
      })();
    </script>
